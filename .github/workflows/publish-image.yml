name: Build and publish Wrangler CLI image

on:
  # Rebuild the image weekly so wrangler@latest is refreshed even without code changes.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'

permissions:
  contents: read

concurrency:
  group: publish-wrangler-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Resolve the exact Wrangler version installed by `wrangler@latest` in
      # the Dockerfile, then use it in immutable and rolling image tags.
      # echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
      # marmar76/wrangler-cli:${{ steps.wrangler.outputs.major_minor }}
      - name: Resolve Wrangler version
        id: wrangler
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view wrangler version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          
          echo "Wrangler version for this image: ${version}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            marmar76/wrangler-cli:latest
            marmar76/wrangler-cli:${{ steps.wrangler.outputs.version }}
            
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Wrangler CLI container
            org.opencontainers.image.description=Cloudflare Wrangler CLI in a trimmed multi-platform container image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.wrangler.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
